# Render Blueprint for the public demo: one free web service built from the Dockerfile.
# See "Public demo" in the README. The button there only works once this file is on main.
#
# The free plan has 512 MB of memory and 0.1 CPU, an ephemeral disk, spins down after 15
# minutes without traffic and takes up to two minutes to wake. That suits the demo: every cold
# start on the ephemeral disk seeds a fresh workspace, so nothing needs to survive one.
services:
  - type: web
    name: officepm-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # A push to the repository does not redeploy the demo by itself.
    autoDeployTrigger: off
    # Unauthenticated, and it reads the database, so a server that cannot reach pm.db is unhealthy.
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: 'true'
      # Under /tmp, the one place the unprivileged user in the image can always write.
      - key: PM_DATA_DIR
        value: /tmp/officepm
      # Render's proxy sets X-Forwarded-For. Without this every visitor shares the proxy's
      # address, and the per-client login and write limits would count them all together.
      - key: PM_TRUST_PROXY
        value: '1'
      # Optional visitor counting, off unless set. Add GOATCOUNTER_CODE in the dashboard
      # (the site code, the part before .goatcounter.com).
      # PORT is set by Render itself (10000) and the server reads it.
      # There is no session secret to configure: sessions are random ids stored in SQLite.
