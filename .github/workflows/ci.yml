name: ci

on:
  push:
  pull_request:

# Least privilege: CI only reads the code and runs checks.
permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck

  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run conformance suite and assert the test count
        shell: bash
        run: |
          set -o pipefail
          pnpm run test:conformance 2>&1 | tee conformance.log
          # The count is a claim the README makes; fail if tests silently vanish.
          grep -qE '^(# |ℹ )tests 104$' conformance.log || { echo 'expected exactly 104 tests'; exit 1; }

  # The same 104 tests, run against the v2 server. This is the P2 exit gate.
  conformance-v2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:server
      - name: Run conformance suite against the v2 server and assert the test count
        shell: bash
        env:
          OFFICEPM_SERVER_CMD: apps/server/dist/main.js
        run: |
          set -o pipefail
          node --test tests/conformance/*.test.js 2>&1 | tee conformance-v2.log
          # Same claim as the v1 job: fail if tests silently vanish or are skipped.
          grep -qE '^(# |ℹ )tests 104$' conformance-v2.log || { echo 'expected exactly 104 tests'; exit 1; }
          grep -qE '^(# |ℹ )pass 104$' conformance-v2.log || { echo 'expected all 104 tests to pass'; exit 1; }

  unit-and-data-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      # Migrates v1-era databases (seeded, old column shape, moved uploads) and
      # boots the frozen v1 server on the result.
      - run: pnpm run test:data-compat

  # The browser client (apps/web): lint, types, component tests and the production build.
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The client imports @officepm/shared from its built output.
      - run: pnpm exec tsc -b packages/shared
      - run: pnpm run lint
      - run: pnpm --filter @officepm/web typecheck
      - run: pnpm --filter @officepm/web test
      - run: pnpm run build:web

  # The browser suite against a seeded v2 server serving the built client: every
  # screen's flows, the security headers in a real browser, and axe over each view
  # in both themes (zero violations). Branch protection should require `ci-required`
  # below, which fails when this job does.
  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @officepm/web exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - name: Keep the Playwright report when the suite fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The container image: built (never pushed), then started to prove it boots, serves the built
  # client and answers its own healthcheck route. Compiles the native modules on Node 24.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build --tag officepm:ci .
      - name: Boot it and check health and the client
        shell: bash
        run: |
          docker run --detach --name officepm-ci --publish 127.0.0.1:3000:3000 \
            --env ADMIN_PASSWORD=ci-admin-password officepm:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health | grep -q '"ok":true' || { docker logs officepm-ci; exit 1; }
          curl -sf http://127.0.0.1:3000/ | grep -q '<title>OfficePM</title>' || { docker logs officepm-ci; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"email":"admin@officepm.local","password":"ci-admin-password"}' http://127.0.0.1:3000/api/login)
          [ "$code" = 200 ] || { echo "login returned $code"; docker logs officepm-ci; exit 1; }
      - name: Show the container log when a step fails
        if: failure()
        run: docker logs officepm-ci || true

  # Known vulnerabilities in the lockfile. Kept out of ci-required on purpose: a new
  # advisory should raise a flag, not block an unrelated pull request.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - run: pnpm audit --audit-level=moderate

  # The one check to mark as required in branch protection. It passes only when every
  # job above (except audit) passed, so adding a job here is how it becomes required.
  ci-required:
    if: always()
    needs: [lint-typecheck, conformance, conformance-v2, unit-and-data-compat, web, web-e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        shell: bash
        run: |
          echo '${{ toJSON(needs) }}'
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}' = 'true' ]; then
            echo 'a required job did not succeed'
            exit 1
          fi
